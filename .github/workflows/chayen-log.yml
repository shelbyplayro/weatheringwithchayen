# ทุก 20 นาที: บันทึกพยากรณ์ บันทึกฝนที่เรดาร์เห็นตรงสวน แล้วคิดคะแนนความแม่น
# รวมรายงาน "ฝนตก/ไม่ตก" ที่ส่งจากปุ่มในแอป (issue ชื่อขึ้นต้น [รายงานฝน]) ไปคิดคะแนนด้วย
# ผลอยู่ใน branch "data" (forecasts.csv, observed.csv, reports.csv, verify.json) แยกจาก main เพื่อไม่ให้หน้าเว็บ build ใหม่ทุกครั้ง
name: chayen-log

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: read

concurrency:
  group: chayen-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check out data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach data origin/data
          else
            git worktree add --detach data
            cd data
            git checkout --orphan data
            git rm -rf --quiet .
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm install --prefix tools --no-audit --no-fund

      - name: Log forecast and observations
        run: node tools/log.mjs
        env:
          DATA_DIR: ${{ github.workspace }}/data
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save to data branch
        working-directory: data
        run: |
          git config user.name "chayen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "log $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:refs/heads/data
