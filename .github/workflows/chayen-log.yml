# Every ~15 min: log the forecast, log whether the radar saw rain over the farm, then score accuracy.
# Also scores the "rain / no rain" reports sent from the app's buttons (issues titled [รายงานฝน]).
# Results live on the "data" branch (forecasts.csv, observed.csv, reports.csv, verify.json), apart from main so the site doesn't rebuild every run.
#
# Who starts it: GitHub's own schedule below only fires every ~6 h in practice, so an outside timer (cron-job.org)
# calls the workflow_dispatch API every 15 min. The schedule stays as a backup. Setup steps: README.md, "Logger timer".
# log.mjs skips the forecast snapshot if another run wrote one less than 5 min ago, so overlapping triggers are harmless.
name: chayen-log

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: read

concurrency:
  group: chayen-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check out data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach data origin/data
          else
            git worktree add --detach data
            cd data
            git checkout --orphan data
            git rm -rf --quiet .
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm install --prefix tools --no-audit --no-fund

      - name: Log forecast and observations
        run: node tools/log.mjs
        env:
          DATA_DIR: ${{ github.workspace }}/data
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save to data branch
        working-directory: data
        run: |
          git config user.name "chayen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "log $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:refs/heads/data
